<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIO - Eye Health Platform</title>

    <!-- 1. Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-yellow': '#E3FF00',
                        'brand-dark': '#121212',
                        'brand-light-dark': '#1E1E1E',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0, transform: 'translateY(10px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        popIn: { '0%': { opacity: 0, transform: 'scale(0.95)' }, '100%': { opacity: 1, transform: 'scale(1)' } },
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'pop-in': 'popIn 0.3s ease-out forwards',
                    }
                }
            }
        }
    </script>

    <!-- 2. Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 3. Custom CSS Styles -->
    <style>
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .animate-bounce-custom .dot { animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        body { padding-top: 68px; background-color: #121212; }
        nav { position: fixed; top: 0; left: 0; right: 0; width: 100%; z-index: 50; }
        .loader { border-top-color: #E3FF00; }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .notification-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
        }
        .notification {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .eye-diagram-part {
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            fill: rgba(255, 255, 255, 0.1);
            stroke: #9ca3af;
            stroke-width: 1;
        }
        .eye-diagram-part:hover, .eye-diagram-part.active {
            fill: rgba(227, 255, 0, 0.3);
            stroke: #E3FF00;
            stroke-width: 2;
        }
    </style>
</head>
<body class="text-gray-200">

    <div id="app"></div>
    <div id="modal-container"></div>
    <div id="notification-container" class="notification-container"></div>
    
    <script>
        // =================================================================
        // STATE MANAGEMENT
        // =================================================================
        let state = {
            currentPage: 'dashboard', // Default page once logged in
            authPage: 'login', // Tracks the current view when not logged in ('login' or 'signup')
            isLoggedIn: false,
            mobileMenuOpen: false,
            scanResult: null,
            isAnalyzing: false,
            chatHistory: [
                { role: 'model', parts: [{ text: 'Hello! I am SIO, your AI assistant. How can I help you with your eye health today?' }] }
            ],
            isTyping: false,
            selectedImage: null,
            usingCamera: false,
            doctors: [],
            isLoadingDoctors: false,
            userProfile: { name: '', age: '', conditions: '' },
            symptoms: { redness: false, blurriness: false, pain: false, floaters: false, headaches: false, 'double-vision': false },
            scanHistory: [],
            appointments: [],
            medications: [],
            isModalOpen: false,
            modalContent: null,
            exerciseTimer: null,
            exerciseSecondsLeft: 20,
            acuityTestLevel: 0,
            colorTestPlate: 0,
            colorTestScore: 0,
            hoveredEyePart: '',
        };

        // =================================================================
        // HTML TEMPLATES
        // =================================================================
        
        const LoginPageHTML = () => `
            <div class="fixed inset-0 flex items-center justify-center bg-brand-dark p-4">
                <div class="w-full max-w-md p-8 rounded-lg bg-brand-light-dark border border-gray-800 animate-pop-in">
                    <div class="text-center mb-8">
                        <div class="flex justify-center items-center mb-4">
                            <i data-lucide="eye" class="w-12 h-12 text-brand-yellow mr-2"></i>
                            <h1 class="text-4xl font-bold text-white">SIO</h1>
                        </div>
                        <p class="text-gray-400">Smart Eye Health Platform</p>
                    </div>
                    <div class="space-y-6">
                        <input id="login-email" type="email" placeholder="Email" class="w-full px-4 py-3 rounded-md border-2 border-gray-700 bg-brand-dark text-white focus:ring-2 focus:ring-brand-yellow focus:border-brand-yellow transition">
                        <input id="login-password" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-md border-2 border-gray-700 bg-brand-dark text-white focus:ring-2 focus:ring-brand-yellow focus:border-brand-yellow transition">
                        <button id="login-btn" class="w-full bg-brand-yellow text-black py-3 rounded-md font-bold text-lg hover:bg-yellow-300 transition-transform transform hover:scale-105">Sign In</button>
                    </div>
                    <div class="mt-6 text-center text-sm">
                        <p class="text-gray-400">Don't have an account? <button id="switch-to-signup" class="text-brand-yellow hover:underline font-medium">Sign Up</button></p>
                    </div>
                </div>
            </div>
        `;
        
        const SignupPageHTML = () => `
            <div class="fixed inset-0 flex items-center justify-center bg-brand-dark p-4">
                <div class="w-full max-w-md p-8 rounded-lg bg-brand-light-dark border border-gray-800 animate-pop-in">
                    <div class="text-center mb-8">
                        <div class="flex justify-center items-center mb-4">
                            <i data-lucide="user-plus" class="w-12 h-12 text-brand-yellow mr-2"></i>
                            <h1 class="text-4xl font-bold text-white">Register for SIO</h1>
                        </div>
                        <p class="text-gray-400">Create your account to start managing your eye health.</p>
                    </div>
                    <div class="space-y-6">
                        <input id="signup-email" type="email" placeholder="Email" class="w-full px-4 py-3 rounded-md border-2 border-gray-700 bg-brand-dark text-white focus:ring-2 focus:ring-brand-yellow focus:border-brand-yellow transition">
                        <input id="signup-username" type="text" placeholder="Username" class="w-full px-4 py-3 rounded-md border-2 border-gray-700 bg-brand-dark text-white focus:ring-2 focus:ring-brand-yellow focus:border-brand-yellow transition">
                        <input id="signup-password" type="password" placeholder="Password" class="w-full px-4 py-3 rounded-md border-2 border-gray-700 bg-brand-dark text-white focus:ring-2 focus:ring-brand-yellow focus:border-brand-yellow transition">
                        <button id="signup-btn" class="w-full bg-brand-yellow text-black py-3 rounded-md font-bold text-lg hover:bg-yellow-300 transition-transform transform hover:scale-105">Sign Up</button>
                    </div>
                    <div class="mt-6 text-center text-sm">
                        <p class="text-gray-400">Already have an account? <button id="switch-to-login" class="text-brand-yellow hover:underline font-medium">Sign In</button></p>
                    </div>
                </div>
            </div>
        `;

        const NavigationHTML = () => `
            <nav class="bg-brand-light-dark/80 backdrop-blur-lg border-b border-gray-800 px-4 py-4">
                <div class="flex items-center justify-between max-w-6xl mx-auto">
                    <div class="flex items-center">
                        <i data-lucide="eye" class="w-8 h-8 text-brand-yellow mr-2"></i>
                        <span class="text-2xl font-bold text-white">SIO</span>
                    </div>
                    <div class="hidden md:flex items-center space-x-8">
                        <button class="nav-btn font-medium transition-colors ${state.currentPage === 'dashboard' ? 'text-brand-yellow' : 'text-gray-400 hover:text-white'}" data-page="dashboard">Dashboard</button>
                        <button class="nav-btn font-medium transition-colors ${state.currentPage === 'scan' ? 'text-brand-yellow' : 'text-gray-400 hover:text-white'}" data-page="scan">Scan</button>
                        <button class="nav-btn font-medium transition-colors ${state.currentPage === 'chatbot' ? 'text-brand-yellow' : 'text-gray-400 hover:text-white'}" data-page="chatbot">Chatbot</button>
                        <button class="nav-btn font-medium transition-colors ${state.currentPage === 'doctors' ? 'text-brand-yellow' : 'text-gray-400 hover:text-white'}" data-page="doctors">Doctors</button>
                        <button class="nav-btn font-medium transition-colors ${state.currentPage === 'symptoms' ? 'text-brand-yellow' : 'text-gray-400 hover:text-white'}" data-page="symptoms">Symptoms</button>
                        <button class="nav-btn font-medium transition-colors ${state.currentPage === 'learn' ? 'text-brand-yellow' : 'text-gray-400 hover:text-white'}" data-page="learn">Learn</button>
                        <!-- Logout Button for Desktop -->
                        <button id="logout-btn" class="flex items-center text-red-400 font-medium hover:text-red-300 transition-colors">
                            <i data-lucide="log-out" class="w-5 h-5 mr-1"></i> Logout
                        </button>
                    </div>
                    <button id="mobile-menu-btn" class="md:hidden p-2 text-gray-300">${state.mobileMenuOpen ? '<i data-lucide="x"></i>' : '<i data-lucide="menu"></i>'}</button>
                </div>
                ${state.mobileMenuOpen ? `
                    <div class="md:hidden mt-4 pb-4">
                        <div class="flex flex-col space-y-4 px-4">
                           <button class="nav-btn text-left font-medium ${state.currentPage === 'dashboard' ? 'text-brand-yellow' : 'text-gray-300'}" data-page="dashboard">Dashboard</button>
                           <button class="nav-btn text-left font-medium ${state.currentPage === 'scan' ? 'text-brand-yellow' : 'text-gray-300'}" data-page="scan">Scan</button>
                           <button class="nav-btn text-left font-medium ${state.currentPage === 'chatbot' ? 'text-brand-yellow' : 'text-gray-300'}" data-page="chatbot">Chatbot</button>
                           <button class="nav-btn text-left font-medium ${state.currentPage === 'doctors' ? 'text-brand-yellow' : 'text-gray-300'}" data-page="doctors">Doctors</button>
                           <button class="nav-btn text-left font-medium ${state.currentPage === 'symptoms' ? 'text-brand-yellow' : 'text-gray-300'}" data-page="symptoms">Symptoms</button>
                           <button class="nav-btn text-left font-medium ${state.currentPage === 'learn' ? 'text-brand-yellow' : 'text-gray-300'}" data-page="learn">Learn</button>
                           <!-- Logout Button for Mobile -->
                           <button id="logout-btn-mobile" class="flex items-center text-red-400 font-medium hover:text-red-300 transition-colors w-full text-left">
                               <i data-lucide="log-out" class="w-5 h-5 mr-2"></i> Logout
                           </button>
                        </div>
                    </div>
                ` : ''}
            </nav>
        `;

        const ScanPageHTML = () => {
            if (state.scanResult) {
                return `
                    <div class="max-w-4xl mx-auto px-4 py-8 animate-fade-in">
                        <div class="bg-brand-light-dark rounded-lg p-6 md:p-8 border border-gray-800 shadow-lg">
                            <div class="flex items-center justify-between mb-6">
                                <h2 class="text-3xl font-bold text-white">Analysis Result</h2>
                                <button id="new-scan-btn" class="flex items-center px-4 py-2 text-brand-yellow hover:bg-gray-800 rounded-md transition-colors"><i data-lucide="rotate-ccw" class="w-4 h-4 mr-2"></i> New Scan</button>
                            </div>
                            <div class="grid md:grid-cols-2 gap-8 items-center">
                                <img src="${state.selectedImage}" class="w-full rounded-md shadow-md">
                                <div class="text-center">
                                    <p class="text-gray-400 text-lg mb-2">Detected Condition:</p>
                                    <h3 class="text-4xl font-extrabold text-brand-yellow">${state.scanResult.prediction.replace('_', ' ')}</h3>
                                    
                                    <!-- MODIFICATION: Display confidence score -->
                                    <p class="text-gray-300 mt-3">Confidence: <span class="font-bold text-lg">${state.scanResult.confidence}</span></p>

                                    <p class="mt-4 text-gray-300">This is a preliminary analysis. Please consult with a qualified ophthalmologist for a definitive diagnosis and treatment plan.</p>
                                    <p class="mt-2 text-sm text-gray-500">This result has been saved to your dashboard.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.isAnalyzing) {
                // This part remains the same
                return `
                    <div class="max-w-2xl mx-auto px-4 py-8 text-center flex flex-col items-center justify-center h-[calc(100vh-150px)]">
                        <img src="${state.selectedImage}" class="w-48 h-48 object-cover rounded-lg mx-auto mb-6 shadow-lg">
                        <div class="flex items-center justify-center space-x-3 text-brand-yellow">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-yellow"></div>
                            <span class="text-xl font-semibold">Analyzing with AI Model...</span>
                        </div>
                    </div>
                `;
            } else if (state.usingCamera) {
                // This part remains the same
                 return `
                    <div class="max-w-2xl mx-auto px-4 py-8 animate-fade-in">
                        <div class="bg-brand-light-dark rounded-lg p-8 border border-gray-800 shadow-lg text-center">
                            <video id="video-feed" autoplay playsinline class="w-full max-w-md mx-auto rounded-md mb-6 bg-black"></video>
                            <canvas id="photo-canvas" class="hidden"></canvas>
                            <button id="capture-photo-btn" class="bg-brand-yellow text-black py-3 px-8 rounded-md font-bold">Capture & Analyze</button>
                            <button id="cancel-camera-btn" class="py-3 px-8 rounded-md font-semibold border-2 border-gray-700 text-gray-300 ml-4">Cancel</button>
                        </div>
                    </div>
                `;
            } else {
                // This part remains the same
                 return `
                    <div class="max-w-4xl mx-auto px-4 py-8 relative overflow-hidden animate-fade-in">
                         <div class="absolute -top-1/2 -left-1/2 w-[200%] h-[200%] -z-10 opacity-5">
                            <svg viewbox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="width: 100%; height: 100%;">
                                <defs><radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%"><stop offset="0%" style="stop-color:rgb(227,255,0);stop-opacity:0.5"></stop><stop offset="100%" style="stop-color:rgb(227,255,0);stop-opacity:0"></stop></radialGradient></defs>
                                <circle cx="50" cy="50" r="30" stroke="#E3FF00" stroke-width="0.2" fill="none"></circle>
                                <circle cx="50" cy="50" r="20" stroke="#E3FF00" stroke-width="0.2" fill="none"></circle>
                                <circle cx="50" cy="50" r="10" fill="url(#grad1)"></circle>
                            </svg>
                        </div>
                        <div class="text-center mb-10">
                            <h1 class="text-5xl font-extrabold mb-4 text-white">AI Eye Health Scanner</h1>
                            <p class="text-lg text-gray-400">Upload a clear photo of an eye for AI-powered analysis.</p>
                        </div>
                        <div class="bg-brand-light-dark/80 backdrop-blur-sm rounded-lg p-8 border border-gray-800 shadow-lg text-center max-w-2xl mx-auto">
                            <button id="upload-btn" class="w-full bg-brand-yellow text-black py-4 px-6 rounded-md font-bold text-lg">Choose Image File</button>
                            <input type="file" id="file-input" class="hidden" accept="image/*">
                            <div class="my-4 text-gray-500">OR</div>
                            <button id="camera-btn" class="w-full flex items-center justify-center py-3 px-6 border-2 border-gray-700 rounded-md font-semibold text-gray-300 hover:border-brand-yellow hover:text-white transition">
                                <i data-lucide="camera" class="w-5 h-5 mr-2"></i> Use Camera
                            </button>
                        </div>
                        <div class="mt-8 bg-brand-light-dark/80 backdrop-blur-sm rounded-lg p-6 border border-gray-800 max-w-2xl mx-auto">
                           <h3 class="text-lg font-bold text-brand-yellow mb-3 flex items-center"><i data-lucide="info" class="w-5 h-5 mr-2"></i>Tips for a Good Scan</h3>
                           <ul class="text-gray-400 space-y-2 text-sm list-disc list-inside">
                               <li>Ensure the eye is in focus and well-lit.</li>
                               <li>Avoid reflections or glare on the eye.</li>
                               <li>Hold the camera steady to prevent blurring.</li>
                               <li>Make sure the image is of the eye only, not the entire face.</li>
                           </ul>
                        </div>
                    </div>
                `;
            }
        };
        
        const ChatbotPageHTML = () => `
            <div class="max-w-4xl mx-auto px-4 py-8 h-[calc(100vh-100px)] flex flex-col animate-fade-in">
                 <div class="bg-brand-light-dark border border-gray-800 rounded-lg shadow-lg flex-1 flex flex-col">
                    <div id="chat-window" class="flex-1 p-6 overflow-y-auto space-y-4">
                        ${state.chatHistory.length === 1 ? `
                            <div class="text-center text-gray-500">
                                <i data-lucide="bot" class="w-16 h-16 mx-auto mb-4"></i>
                                <h2 class="text-xl font-bold text-white mb-2">AI Assistant</h2>
                                <p class="mb-4">Ask me anything about eye health. Here are some suggestions:</p>
                                <div class="grid grid-cols-2 gap-2 text-sm">
                                    <button class="suggestion-btn bg-brand-dark p-3 rounded-md hover:bg-gray-800">What are symptoms of dry eyes?</button>
                                    <button class="suggestion-btn bg-brand-dark p-3 rounded-md hover:bg-gray-800">How to reduce eye strain?</button>
                                    <button class="suggestion-btn bg-brand-dark p-3 rounded-md hover:bg-gray-800">Tell me about glaucoma.</button>
                                    <button class="suggestion-btn bg-brand-dark p-3 rounded-md hover:bg-gray-800">Is it safe to wear contacts overnight?</button>
                                </div>
                            </div>
                        ` : ''}
                        ${state.chatHistory.map(msg => `
                            <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-xs lg:max-w-md px-4 py-3 rounded-lg ${msg.role === 'user' ? 'bg-brand-yellow text-black font-medium' : 'bg-gray-700 text-white'}">${msg.parts[0].text.replace(/\n/g, '<br>')}</div>
                            </div>
                        `).join('')}
                        ${state.isTyping ? `
                            <div class="flex justify-start">
                                <div class="px-4 py-3 rounded-lg bg-gray-700">
                                    <div class="flex space-x-1.5 animate-bounce-custom">
                                        <div class="dot w-2.5 h-2.5 bg-gray-400 rounded-full"></div>
                                        <div class="dot w-2.5 h-2.5 bg-gray-400 rounded-full"></div>
                                        <div class="dot w-2.5 h-2.5 bg-gray-400 rounded-full"></div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="p-4 border-t border-gray-800">
                        <div class="flex space-x-4">
                            <input id="chat-input" type="text" placeholder="Ask about eye health..." class="flex-1 px-4 py-3 rounded-md border-2 border-gray-700 bg-brand-dark text-white focus:ring-2 focus:ring-brand-yellow focus:border-brand-yellow transition w-full">
                            <button id="send-btn" class="bg-brand-yellow text-black px-6 py-3 rounded-md font-bold">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        const DoctorsPageHTML = () => {
            const checkAvailability = (hours) => {
                if (!hours) return { text: 'Hours not available', color: 'gray' };
                const now = new Date();
                const currentDay = now.getDay(); // 0 = Sunday, 1 = Monday...
                const currentTime = now.getHours() * 100 + now.getMinutes();
                
                // This is a simplified parser. A real app would need a more robust one.
                const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
                const todayStr = days[currentDay];

                const parts = hours.toLowerCase().split(' ');
                // Example: "mon-sat 10:00 am - 8:00 pm"
                if (parts.includes(`${todayStr}-`) || parts.includes(`-${todayStr}`)) {
                    try {
                        const startTimeStr = parts[parts.length - 5];
                        const startMeridiem = parts[parts.length - 4];
                        const endTimeStr = parts[parts.length - 2];
                        const endMeridiem = parts[parts.length - 1];

                        let startHour = parseInt(startTimeStr.split(':')[0]);
                        if (startMeridiem === 'pm' && startHour !== 12) startHour += 12;
                        const startTime = startHour * 100 + parseInt(startTimeStr.split(':')[1] || 0);
                        
                        let endHour = parseInt(endTimeStr.split(':')[0]);
                        if (endMeridiem === 'pm' && endHour !== 12) endHour += 12;
                        const endTime = endHour * 100 + parseInt(endTimeStr.split(':')[1] || 0);

                        if (currentTime >= startTime && currentTime <= endTime) {
                            return { text: 'Open Now', color: 'green' };
                        }
                    } catch (e) { /* Fallback */ }
                }
                return { text: 'Closed', color: 'red' };
            };

            return `
            <div class="max-w-6xl mx-auto px-4 py-8 animate-fade-in">
                <div class="mb-8">
                    <h1 class="text-5xl font-extrabold mb-4 text-white">Find Nearby Specialists</h1>
                    <p class="text-lg text-gray-400">Showing top-rated ophthalmologists in Bangalore.</p>
                </div>
                <div id="doctors-list" class="grid md:grid-cols-2 gap-6">
                    ${state.isLoadingDoctors ? `<div class="flex justify-center items-center p-8 md:col-span-2"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-yellow"></div></div>` : 
                    state.doctors.length > 0 ? state.doctors.map((doctor, index) => {
                        const availability = checkAvailability(doctor.hours);
                        return `
                        <div class="bg-brand-light-dark border border-gray-800 rounded-lg p-6 shadow-lg flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold text-white">${doctor.name}</h3>
                                    <span class="text-sm font-semibold px-2 py-1 rounded-md bg-${availability.color}-500/20 text-${availability.color}-300">${availability.text}</span>
                                </div>
                                <p class="text-gray-400 text-sm">${doctor.address}</p>
                                <p class="text-gray-500 text-xs mt-1">${doctor.hours || ''}</p>
                            </div>
                            <div class="flex items-center space-x-4 mt-4">
                                <a href="tel:${doctor.phone}" class="flex-1 text-center bg-brand-dark hover:bg-gray-800 text-brand-yellow font-bold py-2 px-4 rounded-md flex items-center justify-center"><i data-lucide="phone" class="w-4 h-4 mr-2"></i> Contact</a>
                                <button class="book-appointment-btn flex-1 bg-brand-yellow text-black font-bold py-2 px-4 rounded-md" data-doctor-index="${index}">Book</button>
                            </div>
                        </div>
                    `}).join('') : '<div class="md:col-span-2 text-center text-gray-400 bg-brand-light-dark border border-gray-800 rounded-lg p-8">Could not find doctors. Please try again later.</div>'
                }
                </div>
            </div>
        `;}

        const LearnPageHTML = () => `
            <div class="max-w-6xl mx-auto px-4 py-8 animate-fade-in">
                <div class="text-center mb-10">
                    <h1 class="text-5xl font-extrabold mb-4 text-white">Learn & Practice</h1>
                    <p class="text-lg text-gray-400">Interactive tools and information to help you maintain healthy vision.</p>
                </div>
                <div class="bg-brand-light-dark border border-gray-800 rounded-lg p-6 mb-8">
                    <h2 class="text-2xl font-bold text-brand-yellow mb-4">Interactive Eye Exercises & Tests</h2>
                    <div class="grid md:grid-cols-3 gap-4">
                        <button id="start-exercise-202020" class="bg-brand-dark p-4 rounded-md text-center hover:bg-gray-800 transition">
                            <i data-lucide="timer" class="w-8 h-8 mx-auto text-brand-yellow mb-2"></i>
                            <p class="font-semibold text-white">20-20-20 Rule</p>

                state.isTyping = false;
                render();
                return;
            }
            
            const API_MODEL = "gemini-2.5-flash-preview-05-20"; // Use the correct model
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=${apiKey}`;
            
            // Include user context (username) in the system prompt for personalization
            const username = state.userProfile.name || 'User';
            const systemPrompt = `You are an expert AI assistant for eye health called SIO. Your current user is ${username}. Provide helpful, informative, and safe advice regarding eye health questions. You must never provide a medical diagnosis. Always strongly recommend consulting a qualified ophthalmologist for any diagnosis or medical advice. Keep your answers concise and easy to understand. Format your response with markdown for readability.`;
            
            // The API payload uses the current chat history (excluding the first welcome message)
            const payload = {
                contents: state.chatHistory.slice(1),
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };
            
            // Retry configuration for exponential backoff
            const maxRetries = 3;
            const initialDelay = 1000; // 1 second
            let botResponse = "Sorry, I'm having trouble connecting to the AI assistant right now after several retries.";

            for (let retry = 0; retry < maxRetries; retry++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorBody = await response.json();
                        // Retry on rate limit (429) or server errors (5xx)
                        if (response.status === 429 || response.status >= 500) {
                            if (retry < maxRetries - 1) {
                                await new Promise(resolve => setTimeout(resolve, initialDelay * Math.pow(2, retry)));
                                continue;
                            }
                        }
                        throw new Error(`API Error: ${response.status} - ${errorBody.error?.message || response.statusText}`);
                    }

                    const result = await response.json();
                    botResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (botResponse) {
                        break; // Success, break the retry loop
                    } else {
                        throw new Error("Invalid response structure from API.");
                    }

                } catch (error) {
                    console.error(`Chatbot API Error (Retry ${retry + 1}):`, error);
                    if (retry === maxRetries - 1) {
                        botResponse = `Sorry, I'm having trouble connecting to the AI assistant right now after several retries. Details: ${error.message.substring(0, 80)}...`;
                    }
                }
            }
            
            // Update state with the final response (or error message)
            state.chatHistory.push({ role: 'model', parts: [{ text: botResponse }] });
            state.isTyping = false;
            render();
            
            // Scroll to bottom after response is loaded

                chatWindow.scrollTop = chatWindow.scrollHeight;

        async function analyzeImage(imageFile) {
            state.isAnalyzing = true;
            state.selectedImage = URL.createObjectURL(imageFile);
            render(); // Show the analyzing spinner UI

            const formData = new FormData();
            formData.append('image_file', imageFile, imageFile.name);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'An unknown error occurred during prediction.');
                }
                
                // Store the result from the backend
                state.scanResult = result;
                showNotification('Analysis complete and saved to your history!', 'success');

                if(window.fetchDashboardData) {
                   await window.fetchDashboardData();
                }

            } catch (error) {
                console.error('Analysis Error:', error);
                showNotification(`Analysis Failed: ${error.message}`, 'error');
                state.scanResult = null; // Clear result on error
                state.selectedImage = null;
            } finally {
                state.isAnalyzing = false;
                render(); // Re-render to show the final result page or clear on error
            }
        }
        
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                analyzeImage(file);
            }
        }
        
        async function startCamera() {
            state.usingCamera = true;
            render(); 
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const videoFeed = document.getElementById('video-feed');
                if (videoFeed) { videoFeed.srcObject = stream; }
            } catch (err) {
                showNotification('Camera access denied. Please enable permission.', 'error');
                state.usingCamera = false;
                render();
            }
        }
        
        function stopCamera() {
            const videoFeed = document.getElementById('video-feed');
            if(videoFeed && videoFeed.srcObject) {
                videoFeed.srcObject.getTracks().forEach(track => track.stop());
                videoFeed.srcObject = null;
            }
        }

        function capturePhoto() {
                const video = document.getElementById('video-feed');
                const canvas = document.getElementById('photo-canvas');
                if (!video || !canvas) return;

                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(blob => {
                    if (blob) {
                        const photoFile = new File([blob], "camera_capture.jpg", { type: "image/jpeg" });
                        analyzeImage(photoFile);
                    }
                }, 'image/jpeg');

                stopCamera(); // Assumes you have a stopCamera function
        }

        function handleColorTestAnswer(answer) {

                state.colorTestScore++;
            }
            state.colorTestPlate++;
            if (state.colorTestPlate >= plates.length) {
                closeModal();
                showNotification(`Test complete! Your score: ${state.colorTestScore}/${plates.length}. This is not a medical diagnosis.`);
            } else {
                showNextColorPlate();
            }
        }

        // =================================================================
        // MAIN RENDER FUNCTION
        // =================================================================
        const appContainer = document.getElementById('app');

        function render() {
            let content = '';
            if (!state.isLoggedIn) {
                document.body.style.paddingTop = '0px';
                // Use state.authPage to determine which auth form to show
                content = state.authPage === 'login' ? LoginPageHTML() : SignupPageHTML();
            } else {
                document.body.style.paddingTop = '68px'; 
                let pageContent = '';
                switch(state.currentPage) {
                    case 'dashboard': pageContent = DashboardPageHTML(); break;
                    case 'scan': pageContent = ScanPageHTML(); break;
                    case 'chatbot': pageContent = ChatbotPageHTML(); break;
                    case 'doctors': pageContent = DoctorsPageHTML(); break;
                    case 'learn': pageContent = LearnPageHTML(); break;
                    case 'profile': pageContent = ProfilePageHTML(); break;
                    case 'symptoms': pageContent = SymptomCheckerPageHTML(); break;
                    default: pageContent = DashboardPageHTML();
                }
                content = `${NavigationHTML()}<main>${pageContent}</main>`;
            }
            appContainer.innerHTML = content;
            
            lucide.createIcons();
            addEventListeners();
        }

        // Initial render to start the app
        render();

    </script>

</body>
</html>
